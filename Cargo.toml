[package]
name = "cyberdeckstr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
crossterm = "0.29.0"
nostr-sdk = "0.44.1"
ratatui = "0.29.0"
textwrap = "0.16.2"
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bitcoincore-rpc = "0.19.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
